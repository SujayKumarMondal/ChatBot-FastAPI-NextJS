# Render.com Deployment Configuration
# This file describes how to deploy ChatPaat to Render
# Documentation: https://render.com/docs

services:
  # Backend API Service
  - type: web
    name: chatpaat-api
    env: python
    pythonVersion: 3.11
    region: oregon  # Change based on your needs
    plan: starter
    
    repo: https://github.com/YOUR_USERNAME/ChatPaat
    branch: main
    
    buildCommand: |
      cd fastapi_backend && \
      pip install --upgrade pip setuptools wheel && \
      pip install --no-cache-dir -r requirements.txt && \
      alembic upgrade head
    
    startCommand: |
      cd fastapi_backend && \
      gunicorn -w 4 -k uvicorn.workers.UvicornWorker \
        --timeout 120 \
        --access-logfile - \
        --error-logfile - \
        --bind 0.0.0.0:${PORT:-10000} \
        fastapi_server:app
    
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: USE_POSTGRES
        value: "true"
      - key: DB_PORT
        value: "5432"
      - key: DB_SCHEMA
        value: public
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      
      # These should be set in Render dashboard:
      # - DB_NAME
      # - DB_USER
      # - DB_PASSWORD (from Supabase)
      # - DB_HOST (from Supabase)
      # - SECRET_KEY
      # - ALLOWED_ORIGINS
      # - GOOGLE_CLIENT_ID
      # - GOOGLE_CLIENT_SECRET
      # - FRONTEND_URL
      # - GROQ_API_KEY
      # - SENDGRID_API_KEY
    
    healthCheckPath: /health
    healthCheckInterval: 300
    envSecrets:
      - name: DATABASE_URL
    
  # Frontend Service
  - type: web
    name: chatpaat-web
    env: node
    nodeVersion: 20
    region: oregon
    plan: starter
    
    repo: https://github.com/YOUR_USERNAME/ChatPaat
    branch: main
    
    rootDir: frontend
    
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    
    envVars:
      - key: VITE_API_URL
        value: https://chatpaat-api.render.com  # Update with your API service URL

databases:
  # PostgreSQL will be provisioned via Supabase
  # Create manually at supabase.com
  - name: chatpaat-db
    databaseName: postgres
    user: postgres
    region: oregon
    plan: starter  # Use Supabase for managed PostgreSQL